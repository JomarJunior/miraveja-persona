[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "miraveja-persona"
version = "1.0.0"
description = "Public format tools for MiraVeja persona definitions: load, check, freeze and guard."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "ruamel.yaml>=0.18,<0.20",
    "jsonschema>=4.22,<5",
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-jsonschema",
]

[project.scripts]
miraveja-persona = "miraveja_persona.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/miraveja_persona"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ruamel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
