name: ci

on:
  push:
  pull_request:

env:
  # The hub commit whose spec 003 contracts this library is checked against (R-3).
  # Bump it deliberately when the hub's schemas or examples change.
  HUB_COMMIT: db061c2d7ae4a5af1d3f63aff86726199b1daa1a

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JomarJunior/miraveja-ecosystem
          ref: ${{ env.HUB_COMMIT }}
          path: hub
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pytest ruff mypy types-jsonschema
      - name: Guard
        run: miraveja-persona guard
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        env:
          MIRAVEJA_HUB_PATH: ${{ github.workspace }}/hub
        run: pytest
